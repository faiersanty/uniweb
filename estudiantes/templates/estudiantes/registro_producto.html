<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Producto</title>
</head>
<body>
    <h1>Registrar Nuevo Producto</h1>

    <form method="POST" action="{% url 'guardar_producto' %}">
        {% csrf_token %}

        <label for="nombre">Nombre del producto:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea id="descripcion" name="descripcion" rows="3" required></textarea><br><br>

        <label for="precio">Precio:</label><br>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required><br><br>

        <label for="cantidad">Cantidad en stock:</label><br>
        <input type="number" id="cantidad" name="cantidad" min="0" required><br><br>

        <button type="submit">Guardar Producto</button>
    </form>

    <br>
    <a href="{% url 'lista_productos' %}">Ver lista de productos</a> |
    <a href="{% url 'home' %}">Volver al inicio</a>
</body>
</html>
